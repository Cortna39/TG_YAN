{% extends "base.html" %}

{% block title %}Удалить {{ type_label }}{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Удалить {{ type_label }}</h1>
  <p>Вы уверены, что хотите удалить «{{ object.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Удалить</button>
  </form>
{% endblock %}
